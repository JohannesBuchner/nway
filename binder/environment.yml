# Binder environment (see the "Run this notebook in Binder" links in the
# docs HTML pages).
#
# Contains everything the docs/*.ipynb notebooks need, plus
# nway itself, installed editable from this repository
# (pip resolves "-e ." against the repository root).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ipykernel
  - numpy
  - scipy
  - astropy
  - healpy
  - matplotlib
  - tqdm
  - joblib
  - pandas
  - pip
  - pip:
      - -e .
