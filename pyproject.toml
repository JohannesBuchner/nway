[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools", "wheel"]  # PEP 508 specifications.
build-backend = "setuptools.build_meta"

[project]
name = "nway"
version = "4.8.0"
description = "Probabilistic Cross-Identification of Astronomical Sources"
readme = "README.rst"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "astropy", "tqdm", "healpy", "joblib", "matplotlib", "pandas"]
license = {file = "LICENSE"}
authors = [
    { name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com" },
]

[project.optional-dependencies]
test = [
    "pytest"
]

doc = [
    "sphinx_bootstrap_theme",
    "sphinxcontrib.bibtex",
]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/nway/"
Documentation = "https://johannesbuchner.github.io/nway/"
Repository = "https://github.com/JohannesBuchner/nway/"

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"
